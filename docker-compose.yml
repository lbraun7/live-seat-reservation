services:
  api:
    build: .
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      LOG_LEVEL: info
      DATABASE_URL: postgresql://reservation:reservation@postgres:5432/reservation
      REDIS_URL: redis://redis:6379
      DATABASE_CONNECTION_TIMEOUT_MS: 2000
      REDIS_CONNECTION_TIMEOUT_MS: 2000
      SHUTDOWN_TIMEOUT_MS: 10000
      ADMISSION_TOKEN_SECRET: local-development-admission-secret-change-me
      PAYMENT_WEBHOOK_SECRET: local-development-payment-webhook-secret
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://otel-collector:4318/v1/traces
    command:
      [
        'sh',
        '-c',
        'node dist/shared/database/migrate.js && node dist/apps/seed/main.js && node dist/apps/api/main.js',
      ]
    ports:
      - '3000:3000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://127.0.0.1:3000/health/ready']
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    stop_grace_period: 15s

  worker:
    build: .
    environment:
      NODE_ENV: production
      LOG_LEVEL: info
      DATABASE_URL: postgresql://reservation:reservation@postgres:5432/reservation
      REDIS_URL: redis://redis:6379
      DATABASE_CONNECTION_TIMEOUT_MS: 2000
      REDIS_CONNECTION_TIMEOUT_MS: 2000
      SHUTDOWN_TIMEOUT_MS: 10000
      HOLD_EXPIRATION_JOB_ATTEMPTS: 5
      HOLD_EXPIRATION_BACKOFF_MS: 1000
      HOLD_RECONCILER_INTERVAL_MS: 5000
      HOLD_RECONCILER_BATCH_SIZE: 100
      ADMISSION_TOKEN_SECRET: local-development-admission-secret-change-me
      PAYMENT_WEBHOOK_SECRET: local-development-payment-webhook-secret
      METRICS_PORT: 9464
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://otel-collector:4318/v1/traces
    command: ['node', 'dist/apps/worker/main.js']
    depends_on:
      api:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    stop_grace_period: 15s

  outbox-relay:
    build: .
    environment:
      NODE_ENV: production
      LOG_LEVEL: info
      DATABASE_URL: postgresql://reservation:reservation@postgres:5432/reservation
      REDIS_URL: redis://redis:6379
      DATABASE_CONNECTION_TIMEOUT_MS: 2000
      REDIS_CONNECTION_TIMEOUT_MS: 2000
      OUTBOX_RELAY_INTERVAL_MS: 500
      OUTBOX_RELAY_BATCH_SIZE: 100
      OUTBOX_RETENTION_DAYS: 7
      OUTBOX_METRICS_PORT: 9464
      ADMISSION_TOKEN_SECRET: local-development-admission-secret-change-me
      PAYMENT_WEBHOOK_SECRET: local-development-payment-webhook-secret
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://otel-collector:4318/v1/traces
    command: ['node', 'dist/apps/outbox-relay/main.js']
    ports:
      - '9464:9464'
    depends_on:
      api:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    stop_grace_period: 15s

  websocket-gateway:
    build: .
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      LOG_LEVEL: info
      DATABASE_URL: postgresql://reservation:reservation@postgres:5432/reservation
      REDIS_URL: redis://redis:6379
      REDIS_CONNECTION_TIMEOUT_MS: 2000
      SHUTDOWN_TIMEOUT_MS: 10000
      WEBSOCKET_PORT: 3001
      WEBSOCKET_HEARTBEAT_INTERVAL_MS: 30000
      WEBSOCKET_MAX_MESSAGE_BYTES: 4096
      WEBSOCKET_MAX_MESSAGES_PER_MINUTE: 120
      WEBSOCKET_MAX_BUFFERED_BYTES: 1048576
      ADMISSION_TOKEN_SECRET: local-development-admission-secret-change-me
      PAYMENT_WEBHOOK_SECRET: local-development-payment-webhook-secret
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://otel-collector:4318/v1/traces
    command: ['node', 'dist/apps/websocket-gateway/main.js']
    ports:
      - '3001:3001'
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://127.0.0.1:3001/health/ready']
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    stop_grace_period: 15s

  admission-controller:
    build: .
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://reservation:reservation@postgres:5432/reservation
      REDIS_URL: redis://redis:6379
      ADMISSION_TOKEN_SECRET: local-development-admission-secret-change-me
      PAYMENT_WEBHOOK_SECRET: local-development-payment-webhook-secret
      WAITING_ROOM_EVENT_ID: 10000000-0000-4000-8000-000000000001
      ADMISSION_CONTROLLER_INTERVAL_MS: 1000
      ADMISSION_BATCH_SIZE: 25
      MAX_ACTIVE_ADMISSIONS: 100
      ADMISSION_TOKEN_TTL_SECONDS: 60
      ADMISSION_MAX_EXPIRATION_BACKLOG: 10000
      METRICS_PORT: 9464
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://otel-collector:4318/v1/traces
    command: ['node', 'dist/apps/admission-controller/main.js']
    depends_on:
      api:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    stop_grace_period: 15s

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: reservation
      POSTGRES_USER: reservation
      POSTGRES_PASSWORD: reservation
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U reservation -d reservation']
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  redis:
    image: redis:7.4-alpine
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  prometheus:
    image: prom/prometheus:v3.5.0
    command: ['--config.file=/etc/prometheus/prometheus.yml']
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    ports: ['9090:9090']
    depends_on: [api, worker, outbox-relay, websocket-gateway, admission-controller]

  tempo:
    image: grafana/tempo:2.8.2
    command: ['-config.file=/etc/tempo.yml']
    volumes:
      - ./observability/tempo.yml:/etc/tempo.yml:ro
      - tempo-data:/var/tempo
    ports: ['3200:3200']

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.131.1
    command: ['--config=/etc/otelcol.yml']
    volumes:
      - ./observability/otel-collector.yml:/etc/otelcol.yml:ro
    depends_on: [tempo]

  grafana:
    image: grafana/grafana:12.1.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: 'false'
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports: ['3002:3000']
    depends_on: [prometheus, tempo]

volumes:
  postgres-data:
  redis-data:
  prometheus-data:
  tempo-data:
  grafana-data:
