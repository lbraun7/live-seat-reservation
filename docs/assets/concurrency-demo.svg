<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">Live Seat Reservation measured concurrency result</title>
  <desc id="description">A local k6 run completed 100 same-seat iterations with one hold, 99 expected conflicts, 48.1 millisecond p95 HTTP latency, zero oversold seats, and zero active hold collisions.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08111f"/>
      <stop offset="1" stop-color="#111d33"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#818cf8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000814" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="1200" height="630" rx="28" fill="url(#background)"/>
  <circle cx="1080" cy="70" r="180" fill="#2563eb" opacity="0.08"/>
  <circle cx="70" cy="610" r="220" fill="#06b6d4" opacity="0.06"/>

  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="72" y="75" fill="#7dd3fc" font-size="18" font-weight="700" letter-spacing="3">MEASURED LOCALLY WITH K6 + POSTGRESQL</text>
    <text x="72" y="126" fill="#f8fafc" font-size="38" font-weight="750">Same seat. 100 buyers. One winner.</text>
    <text x="72" y="160" fill="#94a3b8" font-size="19">A real Docker run of the repository's contention scenario and SQL invariant audit.</text>

    <g filter="url(#shadow)">
      <rect x="72" y="205" width="1056" height="168" rx="22" fill="#0f1b2d" stroke="#263750"/>
      <rect x="96" y="229" width="224" height="120" rx="16" fill="#13243b"/>
      <rect x="340" y="229" width="224" height="120" rx="16" fill="#13243b"/>
      <rect x="584" y="229" width="224" height="120" rx="16" fill="#13243b"/>
      <rect x="828" y="229" width="276" height="120" rx="16" fill="#102b2c" stroke="#1f766e"/>

      <text x="116" y="263" fill="#94a3b8" font-size="15" font-weight="650">COMPLETED ITERATIONS</text>
      <text x="116" y="318" fill="#f8fafc" font-size="48" font-weight="780">100</text>

      <text x="360" y="263" fill="#94a3b8" font-size="15" font-weight="650">WINNING HOLD</text>
      <text x="360" y="318" fill="#f8fafc" font-size="48" font-weight="780">1</text>

      <text x="604" y="263" fill="#94a3b8" font-size="15" font-weight="650">EXPECTED CONFLICTS</text>
      <text x="604" y="318" fill="#f8fafc" font-size="48" font-weight="780">99</text>

      <text x="848" y="263" fill="#99f6e4" font-size="15" font-weight="700">CHECKS PASSED</text>
      <text x="848" y="318" fill="#5eead4" font-size="48" font-weight="800">100%</text>
    </g>

    <g filter="url(#shadow)">
      <rect x="72" y="397" width="1056" height="133" rx="22" fill="#0f1b2d" stroke="#263750"/>
      <text x="100" y="433" fill="#94a3b8" font-size="15" font-weight="650">POSTGRESQL INVARIANT AUDIT</text>

      <circle cx="112" cy="478" r="18" fill="#0d3b34" stroke="#2dd4bf"/>
      <path d="M103 478l6 6 13-15" fill="none" stroke="#5eead4" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="145" y="486" fill="#e2e8f0" font-size="21" font-weight="700">oversold_seats = 0</text>

      <circle cx="430" cy="478" r="18" fill="#0d3b34" stroke="#2dd4bf"/>
      <path d="M421 478l6 6 13-15" fill="none" stroke="#5eead4" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="463" y="486" fill="#e2e8f0" font-size="21" font-weight="700">active_hold_collisions = 0</text>

      <rect x="895" y="448" width="188" height="57" rx="14" fill="url(#accent)"/>
      <text x="989" y="484" text-anchor="middle" fill="#07111f" font-size="22" font-weight="850">AUDIT PASS</text>
    </g>

    <text x="72" y="575" fill="#64748b" font-size="16">p95 HTTP latency: 48.1 ms</text>
    <text x="1128" y="575" text-anchor="end" fill="#64748b" font-size="16">Local Docker run · 2026-11-18 · latency varies by hardware</text>
  </g>
</svg>
